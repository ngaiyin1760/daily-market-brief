<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved Archive — Daily Market Brief</title>
<meta name="theme-color" content="#4338ca">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Market Brief">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./site.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9"></script>
<!-- Firebase compat SDK (deferred: a slow CDN never blocks page render).
     If these fail to load, the page works exactly as before, localStorage only. -->
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root {
    --sidebar-w: 230px;
    --paper: #f7f2e9;
    --card: #fffdf8;
    --ink: #221f1a;
    --ink-soft: #514c42;
    --muted: #8d8574;
    --rule: #e0d8c6;
    --rule-dark: #b6ab92;
    --accent: #4338ca;          /* deep indigo */
    --accent-2: #0f766e;        /* teal */
    --gold: #c9a227;
    --green: #0d9d6c;
    --red: #d13438;
    --serif: 'Playfair Display', Garamond, Cambria, Georgia, serif;
    --sans: 'Source Sans 3', 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
    font-size: 16px;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: var(--sidebar-w);
    background: linear-gradient(180deg, #171233 0%, #241a4d 60%, #1c1440 100%);
    color: #cfc9bb;
    padding: 28px 0;
    overflow-y: auto;
    border-right: 1px solid #0d0a1f;
  }
  .sidebar .site-title {
    font-family: var(--serif);
    font-size: 21px;
    font-weight: 700;
    color: #f6f1e4;
    padding: 0 22px 16px;
    border-bottom: 1px solid rgba(201, 162, 39, .35);
    margin-bottom: 6px;
    letter-spacing: .01em;
  }
  .sidebar .site-sub {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--gold);
    padding: 0 22px 16px;
  }
  .sidebar nav { padding-top: 8px; }
  .sidebar nav a {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 22px;
    color: #b0a898;
    text-decoration: none;
    font-size: 14.5px;
    border-left: 3px solid transparent;
    transition: background .12s, color .12s, border-color .12s;
  }
  .read-dot {
    flex: 0 0 auto;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, .10), 0 1px 2px rgba(0, 0, 0, .4);
  }
  .read-dot.dot-red { background: #d13438; }
  .read-dot.dot-yellow { background: #e6a700; }
  .read-dot.dot-green { background: #0d9d6c; }
  .sidebar nav a:hover { background: rgba(255, 255, 255, .06); color: #f4eedd; }
  .sidebar nav a.active {
    background: rgba(201, 162, 39, .14);
    color: #f8f3e6;
    border-left-color: var(--gold);
    font-weight: 600;
  }

  /* ---------- Content ---------- */
  .content {
    margin-left: var(--sidebar-w);
    padding: 34px 44px 80px;
    max-width: 1240px;
  }

  /* Masthead band */
  header.masthead {
    background: linear-gradient(120deg, #241a4d 0%, #4338ca 55%, #0f766e 130%);
    border-radius: 8px;
    color: #f6f1e4;
    padding: 30px 34px 26px;
    margin-bottom: 0;
    box-shadow: 0 3px 14px rgba(36, 26, 77, .25);
  }
  header.masthead .kicker {
    font-size: 12px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 8px;
  }
  header.masthead h1 {
    font-family: var(--serif);
    margin: 0;
    font-size: 40px;
    font-weight: 700;
    line-height: 1.1;
  }
  header.masthead .generated {
    color: rgba(246, 241, 228, .72);
    font-size: 14px;
    font-style: italic;
    margin-top: 8px;
  }

  /* Snapshot ticker strip */
  .ticker-wrap {
    border-bottom: 1px solid var(--rule-dark);
    margin-bottom: 30px;
  }
  .ticker {
    padding: 10px 4px 6px;
    margin-bottom: 4px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .06em;
    color: var(--ink-soft);
    font-variant: small-caps;
    white-space: nowrap;
    overflow-x: auto;
  }
  .ticker .m1 { font-size: 11px; margin-right: 2px; }
  .ticker .m1.pos { color: var(--green); }
  .ticker .m1.neg { color: var(--red); }

  /* Data freshness note + live session badge */
  .asof {
    font-size: 12.5px;
    color: var(--muted);
    font-style: italic;
  }
  .ticker-wrap .asof { padding: 0 4px 10px; }
  .desk .asof { margin: -4px 0 16px; }
  .session-badge {
    display: inline-block;
    background: rgba(67, 56, 202, .08);
    border: 1px solid #d4c8f2;
    color: #4c3d8f;
    border-radius: 999px;
    padding: 1px 10px;
    font-size: 11.5px;
    font-weight: 600;
    font-style: normal;
    margin-left: 6px;
  }
  /* The Markets masthead is a dark gradient — the badge there needs light
     colors so it doesn't blend into the background. */
  header.masthead .session-badge {
    background: rgba(246, 241, 228, .12);
    border-color: rgba(246, 241, 228, .35);
    color: #f6f1e4;
  }

  /* ---------- Key Takeaways ---------- */
  .takeaways {
    background: linear-gradient(135deg, #f1ecfd 0%, #e9f6f2 100%);
    border: 1px solid #d4c8f2;
    border-left: 5px solid var(--accent);
    border-radius: 6px;
    padding: 20px 26px 16px;
    margin-bottom: 40px;
    box-shadow: 0 2px 8px rgba(67, 56, 202, .10);
  }
  .takeaways .tw-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .takeaways ul { margin: 0; padding-left: 20px; }
  .takeaways li {
    margin-bottom: 8px;
    font-size: 16.5px;
    line-height: 1.45;
  }
  .takeaways li::marker { color: var(--gold); }

  /* ---------- Saved news (localStorage) ---------- */
  .visually-hidden {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  .saved {
    background: linear-gradient(135deg, #f5f2ea 0%, #efe9f9 100%);
    border: 1px solid #d9cfae;
    border-left: 5px solid var(--gold);
    border-radius: 6px;
    margin-bottom: 26px;
    box-shadow: 0 2px 8px rgba(120, 95, 20, .10);
  }
  .saved-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 18px;
  }
  .saved-icon { color: var(--gold); }
  .saved-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #6b5510;
  }
  .saved-count {
    background: var(--gold);
    color: #241a08;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    min-width: 22px;
    padding: 1px 7px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .saved-clear {
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 6px 4px;
    min-height: 44px;
  }
  .saved-clear:hover { color: var(--red); }

  /* ---------- Pinned Archive link (sidebar, above the date list) ---------- */
  .sidebar-top {
    border-bottom: 1px solid #3a3d44;
    margin-bottom: 8px;
    padding-bottom: 8px;
  }
  .sidebar .archive-link {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 22px;
    color: #e8dfc9;
    font-weight: 600;
    font-size: 14.5px;
    text-decoration: none;
    border-left: 3px solid transparent;
    transition: background .12s, color .12s, border-color .12s;
  }
  .sidebar .archive-link svg { color: var(--gold); flex: 0 0 auto; }
  .sidebar .archive-link:hover { background: rgba(255, 255, 255, .06); color: #fff; }
  .sidebar .archive-link.active {
    background: rgba(201, 162, 39, .14);
    color: #f8f3e6;
    border-left-color: var(--gold);
  }
  .archive-title {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 4px;
    min-height: 44px;
  }
  .sync-status {
    font-size: 12.5px;
    color: var(--muted);
    font-style: italic;
  }
  .sync-status.sync-status-err { color: var(--red); font-style: normal; font-weight: 600; }

  /* Firebase sync auth UI */
  .saved-header-right {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .sync-area { display: flex; align-items: center; }
  .sync-signin {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    min-height: 40px;
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background .12s, transform .12s;
  }
  .sync-signin:hover { background: #372ea6; }
  .sync-signin:active { transform: scale(.97); }
  .sync-user { display: flex; align-items: center; gap: 8px; }
  .sync-avatar { width: 24px; height: 24px; border-radius: 50%; }
  .sync-initial {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sync-label { font-size: 12.5px; color: var(--green); font-weight: 600; }
  .sync-signout {
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 6px 4px;
    min-height: 40px;
  }
  .sync-signout:hover { color: var(--red); }
  .saved-body { padding: 0 18px 14px; }
  .saved-empty { color: var(--muted); font-style: italic; font-size: 14.5px; margin: 4px 0 6px; }
  .saved-group { margin-top: 10px; }
  .saved-group h4 {
    margin: 0 0 4px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 4px;
  }
  .saved-item {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--rule);
  }
  .saved-group .saved-item:last-child { border-bottom: none; }
  .saved-item .si-headline a {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
    text-decoration: none;
    line-height: 1.3;
  }
  .saved-item .si-headline a:hover { color: var(--accent); text-decoration: underline; }
  .saved-item .si-meta {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 3px;
  }
  .saved-item .si-stars { color: var(--gold); letter-spacing: .06em; margin-left: 6px; }
  .saved-item .si-remove {
    flex: 0 0 auto;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
    padding: 10px;
    min-width: 40px;
    min-height: 40px;
    border-radius: 6px;
  }
  .saved-item .si-remove:hover { color: var(--red); background: rgba(209, 52, 56, .08); }

  /* Save toggle button on each news row */
  .save-col { width: 44px; }
  td.save-cell { width: 44px; text-align: center; }
  .save-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #b6ab92;
    padding: 6px;
    min-width: 32px;
    min-height: 32px;
    border-radius: 6px;
    transition: color .12s, background .12s, transform .12s;
  }
  .save-btn:hover { color: var(--gold); background: rgba(201, 162, 39, .12); }
  .save-btn.saved { color: var(--gold); }
  .save-btn.saved svg path { fill: var(--gold); }
  .save-btn:active { transform: scale(1.15); }

  /* ---------- Sections ---------- */
  section.desk { margin-bottom: 44px; }
  section.desk > h2 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--cat, var(--accent));
    margin: 0 0 4px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule-dark);
  }
  section.desk > h2::before {
    content: "";
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 2px;
    background: var(--cat, var(--accent));
    margin-right: 9px;
  }
  section.desk > h2::after {
    content: "";
    display: block;
    width: 56px;
    border-bottom: 3px solid var(--cat, var(--accent));
    margin-top: 6px;
    margin-bottom: -9px;
  }

  /* News table */
  table.news { width: 100%; border-collapse: collapse; }
  table.news th, table.news td {
    text-align: left;
    padding: 14px 14px 14px 8px;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
  }
  table.news th {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    padding-top: 10px;
    padding-bottom: 6px;
  }
  table.news tbody tr { transition: background .12s; }
  table.news tbody tr:nth-child(even) { background: rgba(67, 56, 202, .025); }
  table.news tbody tr:hover { background: rgba(201, 162, 39, .09); }
  table.news tr:last-child td { border-bottom: none; }
  td.headline { width: 30%; }
  td.headline a {
    font-family: var(--serif);
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
    font-size: 17.5px;
    line-height: 1.3;
  }
  td.headline a:hover { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; }
  td.headline .pub { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 5px; }
  td.summary ul { margin: 0; padding-left: 18px; }
  td.summary li { margin-bottom: 5px; font-size: 15px; color: var(--ink-soft); }
  td.source { white-space: nowrap; }
  td.source .chip {
    display: inline-block;
    background: #efe9f9;
    color: #4c3d8f;
    border: 1px solid #ddd2f2;
    border-radius: 999px;
    padding: 2px 11px;
    font-size: 12.5px;
    font-style: normal;
  }
  td.rating { white-space: nowrap; }
  .rating-chip {
    display: inline-block;
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 12.5px;
    font-weight: 700;
    color: #fff;
    min-width: 26px;
    text-align: center;
    line-height: 1.5;
  }
  .rating-chip.r5 { background: #c62828; }   /* red — top importance */
  .rating-chip.r4 { background: #e65100; }   /* orange */
  .rating-chip.r3 { background: #b8860b; }   /* amber */
  .rating-chip.r2 { background: #0f766e; }   /* teal */
  .rating-chip.r1 { background: #8d8574; }   /* gray */
  td.rating .reason {
    display: block;
    color: var(--muted);
    font-size: 12.5px;
    font-style: italic;
    letter-spacing: 0;
    max-width: 130px;
    white-space: normal;
  }
  .empty-note { color: var(--muted); font-style: italic; padding: 12px 0; }

  /* ---------- Importance filter bar ---------- */
  .filter-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 0 0 30px;
  }
  .filter-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .filter-btn {
    background: none;
    border: 1px solid var(--rule-dark);
    border-radius: 999px;
    color: var(--ink-soft);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 5px 14px;
    cursor: pointer;
    min-height: 34px;
    transition: background .12s, color .12s, border-color .12s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ---------- Indicators ---------- */
  .indicator-group { margin-top: 30px; }
  .indicator-group h3 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }
  .chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 16px;
  }
  .chart-card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-top: 3px solid var(--rule-dark);
    border-radius: 5px;
    box-shadow: 0 1px 4px rgba(34, 31, 26, .08);
    padding: 14px 16px 10px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .chart-card.up { border-top-color: var(--green); }
  .chart-card.down { border-top-color: var(--red); }
  .chart-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(34, 31, 26, .14);
  }
  .chart-card .cc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .chart-card .cc-name { font-family: var(--serif); font-weight: 600; font-size: 16px; }
  .chart-card .cc-last {
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .chart-card .cc-change {
    font-size: 13.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }
  .chart-card .cc-change.pos { color: var(--green); }
  .chart-card .cc-change.neg { color: var(--red); }
  .chart-card .cc-change.na, .chart-card .cc-na { color: var(--muted); }
  .chart-card .cc-body { height: 150px; margin-top: 8px; position: relative; }
  .chart-card .cc-na {
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-style: italic;
    font-size: 14px;
    border-top: 1px dashed var(--rule);
    margin-top: 8px;
  }

  /* Zoom buttons under each chart */
  .zoom-bar {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .zoom-btn {
    background: none;
    border: 1px solid var(--rule-dark);
    border-radius: 999px;
    color: var(--ink-soft);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    cursor: pointer;
    min-height: 30px;
    transition: background .12s, color .12s, border-color .12s;
  }
  .zoom-btn:hover { border-color: var(--accent); color: var(--accent); }
  .zoom-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* Performance chips (YTD / 1M / 1Y) on chart cards */
  .cc-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .cc-chips .chip {
    font-size: 11.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    border-radius: 4px;
    padding: 2px 7px;
    background: rgba(34, 31, 26, .05);
  }
  .cc-chips .chip.pos { color: var(--green); }
  .cc-chips .chip.neg { color: var(--red); }

  /* Skeleton placeholders while the Markets tab data loads */
  .skeleton { position: relative; overflow: hidden; }
  .skeleton .skel-bar {
    height: 12px;
    border-radius: 4px;
    background: #e8e1d0;
    margin: 6px 0;
  }
  .skeleton .skel-bar.short { width: 45%; }
  .skeleton .skel-bar.tiny { width: 30%; height: 9px; }
  .skeleton .skel-chart {
    height: 150px;
    border-radius: 4px;
    background: #efe9dc;
    margin-top: 10px;
  }
  .skeleton::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .55), transparent);
    animation: skel-shimmer 1.4s infinite;
  }
  @keyframes skel-shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* Compact numbers table */
  table.figures { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  table.figures th, table.figures td {
    text-align: left;
    padding: 6px 12px 6px 0;
    border-bottom: 1px solid var(--rule);
    font-variant-numeric: tabular-nums;
  }
  table.figures th {
    font-size: 10.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  table.figures tr:last-child td { border-bottom: none; }
  table.figures td.num, table.figures th.num { text-align: right; padding-right: 0; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .flat { color: var(--muted); }
  .na { color: var(--muted); }

  footer.colophon {
    margin-top: 40px;
    padding-top: 14px;
    border-top: 1px solid var(--rule-dark);
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }

  @media (max-width: 820px) {
    body { font-size: 16px; line-height: 1.55; }

    /* Sidebar becomes a compact, horizontally scrollable date strip */
    .sidebar {
      position: static;
      width: 100%;
      padding: 12px 0 10px;
      border-right: none;
      border-bottom: 1px solid #0d0a1f;
    }
    .sidebar .site-title {
      padding: 0 16px 6px;
      font-size: 18px;
      border-bottom: none;
      margin-bottom: 0;
    }
    .sidebar .site-sub { display: none; }
    .sidebar nav {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      gap: 8px;
      padding: 6px 14px 4px;
      scrollbar-width: none;
    }
    .sidebar nav::-webkit-scrollbar { display: none; }
    .sidebar nav a {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      min-height: 44px;
      padding: 8px 16px;
      border: 1px solid rgba(201, 162, 39, .45);
      border-left: 1px solid rgba(201, 162, 39, .45);
      border-radius: 999px;
      font-size: 14px;
      white-space: nowrap;
    }
    .sidebar nav a:hover { background: rgba(255, 255, 255, .08); }
    .sidebar nav a.active {
      background: var(--gold);
      color: #1c1440;
      border-color: var(--gold);
      border-bottom: 1px solid var(--gold);
      font-weight: 700;
    }

    .content { margin-left: 0; padding: 16px 14px 60px; }
    header.masthead { padding: 20px 18px 18px; border-radius: 6px; }
    header.masthead h1 { font-size: 27px; }

    /* Ticker wraps instead of forcing horizontal scroll */
    .ticker-wrap { margin-bottom: 24px; }
    .ticker { white-space: normal; line-height: 1.7; }

    .takeaways { padding: 16px 16px 12px; margin-bottom: 32px; }
    .takeaways li { font-size: 15.5px; }

    /* News rows reflow into stacked cards — no horizontal scrolling */
    table.news thead { display: none; }
    table.news, table.news tbody, table.news tr, table.news td {
      display: block;
      width: 100%;
    }
    table.news tbody tr {
      border-bottom: 1px solid var(--rule-dark);
      /* Reserve a clear strip at the card's top (below the save button zone)
         and top-right, so the button can never overlap the title/summary,
         regardless of headline length or button placement quirks. */
      padding: 58px 56px 12px 0;
      position: relative;
    }
    table.news tbody tr:nth-child(even) { background: none; }
    table.news td { border-bottom: none; padding: 4px 4px; }
    table.news td.headline { width: 100%; }
    td.headline a { font-size: 17px; display: block; padding: 6px 0; }
    td.save-cell {
      position: absolute;
      top: 8px;
      right: 4px;
      left: auto;
      width: auto;
      padding: 0;
    }
    .save-btn { min-width: 44px; min-height: 44px; padding: 10px; }
    .saved-item .si-remove { min-width: 44px; min-height: 44px; }
    .saved-header { flex-wrap: wrap; }
    .sync-signin { min-height: 44px; }
    /* Archive entry becomes the first pill of the strip */
    .sidebar .sidebar-top { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .sidebar .archive-link { border-left: 1px solid rgba(201, 162, 39, .45); }
    .sidebar .archive-link.active {
      background: var(--gold);
      color: #1c1440;
      border-color: var(--gold);
      font-weight: 700;
    }
    /* Active pill is gold-filled — switch the bookmark icon to the text color
       so it stays visible (gold icon on gold background disappears). */
    .sidebar .archive-link.active svg { color: #1c1440; }
    td.summary li { font-size: 15px; }
    td.source { padding-top: 6px; }
    td.rating { padding-top: 4px; }
    td.rating .reason { max-width: none; }

    /* Figures tables stay 3 columns but get breathing room */
    table.figures { font-size: 14px; }

    .chart-grid { grid-template-columns: 1fr; gap: 14px; }
    .chart-card .cc-body { height: 180px; }
    .chart-card .cc-na { height: 120px; }

    section.desk { margin-bottom: 36px; }
  }
</style>

<body>


<aside class="sidebar">
  <div class="site-title">Daily Market Brief</div>
  <div class="site-sub">Market Intelligence</div>
  <nav class="sidebar-top">
    <a class="archive-link"
       href="./markets.html">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <path d="M4 19V9M10 19V5M16 19v-7M22 19H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>Markets</span>
    </a>
    <a class="archive-link active"
       href="./archive.html" aria-current="page">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <path d="M6.5 2.5h11a1 1 0 0 1 1 1v18l-6.5-4.2-6.5 4.2v-18a1 1 0 0 1 1-1z"

  <nav id="date-nav"><a href="#" class="na">Loading…</a></nav>
</aside>

<div class="content">
  <header class="masthead">
    <div class="kicker">Daily Market Brief</div>
    <h1>Saved Archive</h1>
    <div class="generated">Your saved stories across all briefs</div>
  </header>

    <section class="saved" id="saved">
      <div class="saved-header">
        <div class="archive-title">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" class="saved-icon">
            <path d="M6.5 2.5h11a1 1 0 0 1 1 1v18l-6.5-4.2-6.5 4.2v-18a1 1 0 0 1 1-1z"
                  fill="currentColor"/>
          </svg>
          <span class="saved-title">Saved Archive</span>
          <span class="saved-count" id="saved-count">0</span>
        </div>
        <div class="saved-header-right">
          <span class="sync-status" id="sync-status"></span>
          <div class="sync-area" id="sync-area">
            <button type="button" class="sync-signin" id="sync-signin">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                <path fill="currentColor" d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81z"/>
              </svg>
              Sign in to sync
            </button>
            <div class="sync-user" id="sync-user" style="display:none">
              <img class="sync-avatar" id="sync-avatar" alt="" referrerpolicy="no-referrer" style="display:none">
              <span class="sync-initial" id="sync-initial" style="display:none"></span>
              <span class="sync-label">Synced</span>
              <button type="button" class="sync-signout" id="sync-signout">Sign out</button>
            </div>
          </div>
          <button type="button" class="saved-clear" id="saved-clear">Clear all</button>
        </div>
      </div>
      <div class="saved-body" id="saved-body">
        <p class="saved-empty" id="saved-empty">No saved news yet — tap the bookmark on any story to pin it here.</p>
        <div id="saved-list"></div>
      </div>
    </section>
</div>

<script>
(function () {
  var base = ".";
  // Cache-buster: every generated page embeds its own generation timestamp,
  // so the data files never serve stale from the CDN's 10-minute cache.
  var dataTS = encodeURIComponent("2026-08-04 00:24 HKT");
  // Dashboard pages set current_date_js to the page date; the archive page
  // leaves it null (no per-day read tracking there).
  var currentDate = null;

  // Write-through hooks for Firebase cloud sync. No-ops until the Firebase
  // layer (bottom of this script) replaces them after sign-in.
  var syncPush = { saved: function () {}, read: function () {} };
  function onLocalMutation(kind) {
    try { if (syncPush[kind]) syncPush[kind](); } catch (e) {
      console.warn("Sync push failed:", e);
    }
  }

  // ---------- Read status traffic lights (localStorage) ----------
  // dmb_read: { "YYYY-MM-DD": { v: [viewed category ids], t: total categories } }
  var READ_KEY = "dmb_read";
  var READ_TITLES = { red: "Unread", yellow: "Partially read", green: "Read" };

  function loadRead() {
    try {
      var m = JSON.parse(localStorage.getItem(READ_KEY));
      return (m && typeof m === "object") ? m : {};
    } catch (e) { return {}; }
  }
  function storeRead(map) {
    try { localStorage.setItem(READ_KEY, JSON.stringify(map)); } catch (e) {}
    onLocalMutation("read");
  }

  // Reading covers only news category sections — indicators are optional.
  var newsSections = Array.prototype.slice.call(
    document.querySelectorAll("section.desk[id]:not(#indicators)"));
  var newsTotal = newsSections.length;

  function readStatusFor(date) {
    var rec = loadRead()[date];
    if (!rec || !rec.v || !rec.v.length) return "red";
    if (rec.v.length >= (rec.t || rec.v.length)) return "green";
    return "yellow";
  }

  function updateDots() {
    document.querySelectorAll(".read-dot").forEach(function (dot) {
      var st = readStatusFor(dot.getAttribute("data-dot-date"));
      dot.className = "read-dot dot-" + st;
      dot.title = READ_TITLES[st];
    });
  }

  function makeDot(date) {
    var st = readStatusFor(date);
    var dot = document.createElement("span");
    dot.className = "read-dot dot-" + st;
    dot.setAttribute("data-dot-date", date);
    dot.title = READ_TITLES[st];
    return dot;
  }

  function markViewed(id) {
    var map = loadRead();
    var rec = map[currentDate] || { v: [], t: newsTotal };
    rec.t = newsTotal;
    if (rec.v.indexOf(id) === -1) {
      rec.v.push(id);
      map[currentDate] = rec;
      storeRead(map);
      updateDots();  // live red -> yellow -> green on this page
    }
  }

  if ("IntersectionObserver" in window && newsTotal) {
    var readObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          markViewed(en.target.id);
          readObserver.unobserve(en.target);
        }
      });
    }, { threshold: 0.3 });
    newsSections.forEach(function (s) { readObserver.observe(s); });
  }

  // Build the sidebar date list from manifest.json so that every page —
  // including older day pages — automatically shows newly added days.
  fetch(base + "/manifest.json?v=" + dataTS)
    .then(function (r) { return r.json(); })
    .then(function (m) {
      var nav = document.getElementById("date-nav");
      nav.innerHTML = "";
      (m.dates || []).forEach(function (d, idx) {
        var a = document.createElement("a");
        a.appendChild(makeDot(d));
        a.appendChild(document.createTextNode(d));
        a.href = idx === 0 ? base + "/index.html" : base + "/days/" + d + ".html";
        if (d === currentDate) a.className = "active";
        nav.appendChild(a);
      });
      updateDots();
    })
    .catch(function () {
      document.getElementById("date-nav").innerHTML =
        '<a href="' + base + '/index.html">Latest</a>';
    });

  // ---------- Live market session badge (approximate hours, HKT) ----------
  // DST handled roughly: US & UK use summer hours Apr-Oct. Sessions:
  // Tokyo 08:00-14:00, Hong Kong 09:30-16:00, London 15:00-23:30 (BST) /
  // 16:00-00:30 (GMT), New York 21:30-04:00 (EDT) / 22:30-05:00 (EST).
  var sessionEl = document.getElementById("session-badge");
  if (sessionEl) {
    var nowUtc = new Date();
    var utcDay = nowUtc.getUTCDay();
    var hktMin = ((nowUtc.getUTCHours() + 8) % 24) * 60
      + nowUtc.getUTCMinutes();
    var month = nowUtc.getUTCMonth() + 1;
    var usSummer = month >= 4 && month <= 10;
    var ukSummer = month >= 4 && month <= 10;
    function openIn(s, e) {
      if (s <= e) return hktMin >= s && hktMin <= e;
      return hktMin >= s || hktMin <= e;
    }
    var open = [];
    if (utcDay !== 0 && utcDay !== 6) {
      if (openIn(8 * 60, 14 * 60)) open.push("Tokyo");
      if (openIn(570, 16 * 60)) open.push("Hong Kong");
      if (openIn((ukSummer ? 15 : 16) * 60, (ukSummer ? 23 : 0) * 60 + 30)) {
        open.push("London");
      }
      if (openIn((usSummer ? 21 : 22) * 60 + 30,
                 (usSummer ? 4 : 5) * 60)) {
        open.push("New York");
      }
    }
    sessionEl.textContent = open.length
      ? open.join(" · ") + " open" : "Markets closed";
  }

  // ---------- Importance filter (daily pages) ----------
  var filterBar = document.getElementById("importance-filter");
  if (filterBar) {
    var filterRows = Array.prototype.slice.call(
      document.querySelectorAll("tr.news-item"));
    var filterSections = document.querySelectorAll("section.desk");
    function applyFilter(min) {
      filterRows.forEach(function (tr) {
        var r = parseInt(tr.getAttribute("data-rating"), 10) || 0;
        tr.style.display = r >= min ? "" : "none";
      });
      Array.prototype.forEach.call(filterSections, function (sec) {
        var anyVisible = Array.prototype.some.call(
          sec.querySelectorAll("tr.news-item"),
          function (tr) { return tr.style.display !== "none"; });
        sec.style.display = anyVisible ? "" : "none";
      });
    }
    filterBar.querySelectorAll(".filter-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        filterBar.querySelectorAll(".filter-btn").forEach(function (b) {
          var on = b === btn;
          b.classList.toggle("active", on);
          b.setAttribute("aria-pressed", on ? "true" : "false");
        });
        applyFilter(parseInt(btn.getAttribute("data-min"), 10) || 0);
      });
    });
  }

  // ---------- Saved news (localStorage) ----------
  var STORE_KEY = "dmb_saved";

  function loadSaved() {
    try {
      var m = JSON.parse(localStorage.getItem(STORE_KEY));
      return (m && typeof m === "object") ? m : {};
    } catch (e) { return {}; }
  }
  function storeSaved(map) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(map)); } catch (e) {}
    setSavedRev(Date.now());  // local mutation wins sync conflicts (LWW)
    onLocalMutation("saved");
  }

  // Revision counter for last-writer-wins sync of the saved map. Union-merge
  // alone can never propagate deletions (a cleared/removed key is simply
  // absent from the union), so the remote doc carries a savedRev timestamp;
  // a newer remote revision is adopted wholesale instead of unioned.
  var SAVED_REV_KEY = "dmb_saved_rev";
  function getSavedRev() {
    try { return parseInt(localStorage.getItem(SAVED_REV_KEY), 10) || 0; }
    catch (e) { return 0; }
  }
  function setSavedRev(rev) {
    try { localStorage.setItem(SAVED_REV_KEY, String(rev)); } catch (e) {}
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  var savedList = document.getElementById("saved-list");
  var savedEmpty = document.getElementById("saved-empty");
  var savedCount = document.getElementById("saved-count");
  var savedClear = document.getElementById("saved-clear");

  // Category order + accent colors for Archive grouping (from the brief's
  // configured categories, so group order matches the daily brief).
  var CAT_ORDER = ["Global Economy", "Equity Markets", "Fixed Income", "China Economy", "Hong Kong Economy", "Global Technology", "Artificial Intelligence", "Semiconductors", "Electric Vehicles", "Data Centers", "Space \u0026 Aerospace"];
  var CAT_COLORS = {};
  
  CAT_COLORS["Global Economy"] = "#4338ca";
  
  CAT_COLORS["Equity Markets"] = "#047857";
  
  CAT_COLORS["Fixed Income"] = "#92400e";
  
  CAT_COLORS["China Economy"] = "#be123c";
  
  CAT_COLORS["Hong Kong Economy"] = "#1d4ed8";
  
  CAT_COLORS["Global Technology"] = "#7c3aed";
  
  CAT_COLORS["Artificial Intelligence"] = "#c026d3";
  
  CAT_COLORS["Semiconductors"] = "#0e7490";
  
  CAT_COLORS["Electric Vehicles"] = "#65a30d";
  
  CAT_COLORS["Data Centers"] = "#b45309";
  
  CAT_COLORS["Space \u0026 Aerospace"] = "#581c87";
  

  function markRowButtons() {
    var map = loadSaved();
    document.querySelectorAll("tr.news-item").forEach(function (tr) {
      var btn = tr.querySelector(".save-btn");
      if (!btn) return;
      var saved = !!map[tr.getAttribute("data-url")];
      btn.classList.toggle("saved", saved);
      btn.setAttribute("aria-pressed", saved ? "true" : "false");
      btn.title = saved ? "Remove from saved" : "Save this story";
    });
  }

  function renderSaved() {
    if (!savedList) return;  // brief pages have no archive list (by design)
    var map = loadSaved();
    var urls = Object.keys(map);
    if (savedCount) savedCount.textContent = urls.length;
    if (savedEmpty) savedEmpty.style.display = urls.length ? "none" : "";
    savedList.innerHTML = "";
    if (!urls.length) return;

    // Group by category, ordered like the daily brief's category order.
    var groups = {};
    urls.forEach(function (u) {
      var it = map[u];
      (groups[it.category || "Other"] = groups[it.category || "Other"] || []).push(it);
    });
    var names = Object.keys(groups).sort(function (a, b) {
      var ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });

    names.forEach(function (name) {
      // Within a category: newest brief date first, tie-break by save time.
      var items = groups[name].slice().sort(function (a, b) {
        var da = a.pageDate || "", db = b.pageDate || "";
        if (da !== db) return da < db ? 1 : -1;
        return (b.savedAt || 0) - (a.savedAt || 0);
      });
      var color = CAT_COLORS[name] || "#4338ca";
      var g = document.createElement("div");
      g.className = "saved-group";
      var html = '<h4 style="color:' + color + ';border-bottom-color:' + color + '">'
        + esc(name) + "</h4>";
      items.forEach(function (it) {
        var rating = Math.max(0, Math.min(5, parseInt(it.rating, 10) || 0));
        var stars = "★".repeat(rating) + "☆".repeat(5 - rating);
        html += '<div class="saved-item" data-url="' + esc(it.url) + '">'
          + '<div class="si-headline"><a href="' + esc(it.url) + '" target="_blank" rel="noopener">'
          + esc(it.title) + "</a>"
          + '<div class="si-meta">' + esc(it.source)
          + (it.pageDate ? " · Brief of " + esc(it.pageDate) : "")
          + '<span class="si-stars">' + stars + "</span></div></div>"
          + '<button type="button" class="si-remove" aria-label="Remove saved story" title="Remove">✕</button>'
          + "</div>";
      });
      g.innerHTML = html;
      savedList.appendChild(g);
    });
  }

  document.querySelectorAll("tr.news-item .save-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var tr = btn.closest("tr.news-item");
      var url = tr.getAttribute("data-url");
      if (!url) return;
      var map = loadSaved();
      if (map[url]) {
        delete map[url];
      } else {
        map[url] = {
          title: tr.getAttribute("data-title") || "",
          url: url,
          source: tr.getAttribute("data-source") || "",
          category: tr.getAttribute("data-category") || "",
          rating: parseInt(tr.getAttribute("data-rating"), 10) || 0,
          pageDate: tr.getAttribute("data-date") || "",
          savedAt: Date.now()
        };
      }
      storeSaved(map);
      markRowButtons();
      renderSaved();
    });
  });

  // Per-item remove (✕), event-delegated from the list container.
  // BUG FIX: the old handler called ev.target.closest() directly — on mobile
  // browsers the click target can be the ✕ TEXT NODE inside the button, and
  // text nodes have no .closest(), so the handler threw and did nothing.
  // Normalize to an Element first, and delegate robustly via closest().
  if (savedList) {
    savedList.addEventListener("click", function (ev) {
      var t = ev.target;
      if (t && t.nodeType !== 1) t = t.parentElement;  // text node -> element
      var rm = (t && t.closest) ? t.closest(".si-remove") : null;
      if (!rm) return;
      ev.preventDefault();
      var itemEl = rm.closest(".saved-item");
      var url = itemEl && itemEl.getAttribute("data-url");
      if (!url) return;
      var map = loadSaved();
      delete map[url];
      storeSaved(map);   // persists localStorage + Firestore write-through
      markRowButtons();  // un-bookmark the news row if present on this page
      renderSaved();
    });
  }

  if (savedClear) {
    savedClear.addEventListener("click", function () {
      if (!Object.keys(loadSaved()).length) return;
      if (confirm("Remove all saved news?")) {
        storeSaved({});
        markRowButtons();
        renderSaved();
      }
    });
  }

  markRowButtons();
  renderSaved();
  // ---------- Firebase cloud sync (optional; degrades to localStorage-only) ----------
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyCAubF71-5rKvRZ3NoKkOBfpoKVCzW2iYY",
    authDomain: "daily-market-brief-2d93c.firebaseapp.com",
    projectId: "daily-market-brief-2d93c",
    storageBucket: "daily-market-brief-2d93c.firebasestorage.app",
    messagingSenderId: "813144681948",
    appId: "1:813144681948:web:2a8f45be4e7019bb03b319"
  };

  // saved: union by URL key; on conflict keep the entry with the later savedAt.
  function mergeSavedMaps(local, remote) {
    var out = {}, k;
    for (k in local) out[k] = local[k];
    for (k in remote) {
      if (!out[k] || (remote[k].savedAt || 0) > (out[k].savedAt || 0)) {
        out[k] = remote[k];
      }
    }
    return out;
  }

  // read: per date, union of viewed category ids; t = max of the two totals.
  function mergeReadMaps(local, remote) {
    var out = {}, k;
    for (k in local) out[k] = local[k];
    for (k in remote) {
      var cur = out[k], inc = remote[k];
      if (!cur) { out[k] = inc; continue; }
      var viewed = (cur.v || []).slice();
      (inc.v || []).forEach(function (id) {
        if (viewed.indexOf(id) === -1) viewed.push(id);
      });
      out[k] = { v: viewed, t: Math.max(cur.t || 0, inc.t || 0) };
    }
    return out;
  }

  // BUG FIX: the saved map is keyed by raw URLs, but Firestore field names
  // cannot contain "/" (or ~ * [ ]) — every write with URL keys was being
  // rejected with INVALID_ARGUMENT (silently, caught by console.warn), which
  // is why saved items never reached the cloud. Keys are URL-encoded for
  // Firestore (dots also escaped, so merge can never misread them as field
  // paths) and decoded back to plain URLs for localStorage. Data model is
  // unchanged: users/{uid} still has a `saved` map, just with encoded keys.
  function encodeSavedForRemote(map) {
    var out = {};
    Object.keys(map || {}).forEach(function (k) {
      out[encodeURIComponent(k).replace(/\./g, "%2E")] = map[k];
    });
    return out;
  }
  function decodeSavedFromRemote(map) {
    var out = {};
    Object.keys(map || {}).forEach(function (k) {
      try { out[decodeURIComponent(k)] = map[k]; } catch (e) {
        console.error("Skipping undecodable saved key:", k, e);
      }
    });
    return out;
  }

  // Transient sync status shown in the Archive header (observability: silent
  // failures made the original bug invisible).
  function syncStatus(msg, isErr) {
    var el = document.getElementById("sync-status");
    if (!el) return;
    el.textContent = msg || "";
    el.classList.toggle("sync-status-err", !!isErr);
  }
  function timeNow() {
    var d = new Date();
    return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }

  // Write merged state to localStorage directly (no push-back) and re-render.
  function applySyncedState(savedMap, readMap) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(savedMap)); } catch (e) {}
    try { localStorage.setItem(READ_KEY, JSON.stringify(readMap)); } catch (e) {}
    markRowButtons();
    renderSaved();
    updateDots();
  }

  function initFirebaseSync() {
    var area = document.getElementById("sync-area");
    if (typeof firebase === "undefined" || !firebase.initializeApp) {
      // CDN blocked/offline: hide the sync UI, keep localStorage behavior.
      if (area) area.style.display = "none";
      return;
    }
    try {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      var auth = firebase.auth();
      var db = firebase.firestore();
      var provider = new firebase.auth.GoogleAuthProvider();
      var syncUser = null;
      var unsubscribeSnapshot = null;
      var readWriteTimer = null;

      function userDoc() { return db.collection("users").doc(syncUser.uid); }

      function serverTs() {
        return firebase.firestore.FieldValue.serverTimestamp();
      }

      function updateSyncUI(user) {
        // Auth UI lives only on the archive page; brief pages sync silently.
        var inBtn = document.getElementById("sync-signin");
        var userEl = document.getElementById("sync-user");
        var avatar = document.getElementById("sync-avatar");
        var initial = document.getElementById("sync-initial");
        if (!inBtn || !userEl) return;
        if (user) {
          inBtn.style.display = "none";
          userEl.style.display = "flex";
          if (user.photoURL) {
            avatar.src = user.photoURL;
            avatar.style.display = "";
            initial.style.display = "none";
          } else {
            avatar.style.display = "none";
            initial.style.display = "";
            initial.textContent = (user.email || "U").charAt(0).toUpperCase();
          }
        } else {
          inBtn.style.display = "";
          userEl.style.display = "none";
        }
      }

      // Push the saved map so that it REPLACES the remote `saved` field
      // wholesale (update semantics) — merge writes can never delete keys,
      // which is why removals/clear-all previously never reached the cloud.
      function pushSaved() {
        var payload = {
          saved: encodeSavedForRemote(loadSaved()),
          savedRev: getSavedRev(),
          updatedAt: serverTs()
        };
        return userDoc().update(payload).catch(function (e) {
          if (e && e.code === "not-found") {
            payload.read = loadRead();
            return userDoc().set(payload);
          }
          throw e;
        });
      }

      // On sign-in: last-writer-wins by savedRev, then write the result back.
      // Union-merge alone resurrects deletions (a removed key is simply absent
      // from the union), so the newer revision is adopted wholesale instead.
      function initialSync() {
        userDoc().get().then(function (snap) {
          var remote = snap.exists ? (snap.data() || {}) : {};
          var remoteSaved = decodeSavedFromRemote(remote.saved);
          var remoteRev = remote.savedRev || 0;
          var localRev = getSavedRev();
          var localSaved = loadSaved();
          var mergedSaved;
          if (remoteRev > localRev) {
            // Remote newer: adopt it (deletions stick). A never-synced device
            // (rev 0) may hold pre-sync local items — fold those in.
            mergedSaved = (localRev === 0)
              ? mergeSavedMaps(localSaved, remoteSaved) : remoteSaved;
          } else if (localRev === 0 && remoteRev === 0) {
            mergedSaved = mergeSavedMaps(localSaved, remoteSaved);  // first-ever sync: union
          } else {
            mergedSaved = localSaved;  // local newer: already reflects local deletions
          }
          var newRev = Date.now();
          setSavedRev(newRev);
          var mergedRead = mergeReadMaps(loadRead(), remote.read || {});
          applySyncedState(mergedSaved, mergedRead);
          return userDoc().update(
            { saved: encodeSavedForRemote(mergedSaved), savedRev: newRev,
              read: mergedRead, updatedAt: serverTs() })
            .catch(function (e) {
              if (e && e.code === "not-found") {
                return userDoc().set(
                  { saved: encodeSavedForRemote(mergedSaved), savedRev: newRev,
                    read: mergedRead, updatedAt: serverTs() });
              }
              throw e;
            });
        }).then(function () {
          syncStatus("Synced · " + timeNow(), false);
        }).catch(function (e) {
          console.error("Initial sync failed:", e && e.code, e);
          syncStatus("Sync failed — check console/rules", true);
        });
      }

      // Realtime laptop <-> phone updates; skip our own pending writes.
      function subscribeRemote() {
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        unsubscribeSnapshot = userDoc().onSnapshot(function (snap) {
          if (snap.metadata.hasPendingWrites || !snap.exists) return;
          var remote = snap.data() || {};
          var remoteRev = remote.savedRev || 0;
          var localRev = getSavedRev();
          var localSaved = loadSaved();
          var newSaved = localSaved;
          var needsPush = false;
          if (remoteRev > localRev) {
            // Remote newer: adopt wholesale (deletions propagate). Fold in
            // legacy local items only on a never-synced device, then push.
            newSaved = decodeSavedFromRemote(remote.saved);
            if (localRev === 0) {
              var folded = mergeSavedMaps(localSaved, newSaved);
              if (Object.keys(folded).length !== Object.keys(newSaved).length) {
                newSaved = folded;
                setSavedRev(Date.now());
                needsPush = true;
              } else {
                setSavedRev(remoteRev);
              }
            } else {
              setSavedRev(remoteRev);
            }
          }
          // Read status has no deletions — union-merge is always safe.
          var mergedRead = mergeReadMaps(loadRead(), remote.read || {});
          if (JSON.stringify(newSaved) !== JSON.stringify(localSaved) ||
              JSON.stringify(mergedRead) !== JSON.stringify(loadRead())) {
            applySyncedState(newSaved, mergedRead);
            syncStatus("Synced · " + timeNow(), false);
          }
          if (needsPush) pushSaved();
        }, function (e) {
          console.error("Sync listener error:", e && e.code, e);
          syncStatus("Sync failed — check console/rules", true);
        });
      }

      function writeSaved() {
        if (!syncUser) return;
        pushSaved()
          .then(function () { syncStatus("Synced · " + timeNow(), false); })
          .catch(function (e) {
            console.error("Sync write (saved) failed:", e && e.code, e);
            syncStatus("Sync failed — check console/rules", true);
          });
      }
      function flushRead() {
        if (!syncUser) return;
        userDoc().set({ read: loadRead(), updatedAt: serverTs() },
          { merge: true })
          .then(function () { syncStatus("Synced · " + timeNow(), false); })
          .catch(function (e) {
            console.error("Sync write (read) failed:", e && e.code, e);
            syncStatus("Sync failed — check console/rules", true);
          });
      }
      function scheduleReadWrite() {
        clearTimeout(readWriteTimer);
        readWriteTimer = setTimeout(flushRead, 5000);  // debounce scroll progress
      }

      window.addEventListener("pagehide", function () {
        clearTimeout(readWriteTimer);
        flushRead();
      });
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") {
          clearTimeout(readWriteTimer);
          flushRead();
        }
      });

      var signinBtn = document.getElementById("sync-signin");
      var signoutBtn = document.getElementById("sync-signout");
      if (signinBtn) signinBtn.addEventListener("click", function () {
        auth.signInWithPopup(provider).catch(function (err) {
          // Popup blocked/failed (common on mobile) -> redirect flow.
          if (err && err.code === "auth/popup-closed-by-user") return;
          console.warn("Popup sign-in failed, falling back to redirect:",
            err && err.code);
          auth.signInWithRedirect(provider)
            .catch(function (e2) { console.warn("Redirect sign-in failed:", e2); });
        });
      });
      if (signoutBtn) signoutBtn.addEventListener("click", function () {
        auth.signOut().catch(function (e) { console.warn("Sign-out failed:", e); });
      });
      auth.getRedirectResult()
        .catch(function (e) {
          console.error("Redirect result error:", e && e.code, e);
          syncStatus("Sign-in failed — check console", true);
        });

      auth.onAuthStateChanged(function (user) {
        syncUser = user || null;
        updateSyncUI(user);
        if (user) {
          syncPush.saved = writeSaved;
          syncPush.read = scheduleReadWrite;
          initialSync();
          subscribeRemote();
        } else {
          syncPush.saved = function () {};
          syncPush.read = function () {};
          syncStatus("", false);
          if (unsubscribeSnapshot) {
            unsubscribeSnapshot();
            unsubscribeSnapshot = null;
          }
        }
      });
    } catch (e) {
      console.warn("Firebase sync disabled:", e);
      if (area) area.style.display = "none";
    }
  }
  // Deferred Firebase scripts execute before window.load, so firebase is
  // available here if the CDN delivered it.
  window.addEventListener("load", initFirebaseSync);
})();
</script>
</body>
</html>
