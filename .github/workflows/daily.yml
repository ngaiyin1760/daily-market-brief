name: Daily Market Brief

on:
  schedule:
    # Target: ready by 7:00 AM Hong Kong time. GitHub frequently delays
    # scheduled runs (especially on-the-hour), so fire at 22:17 UTC =
    # 6:17 AM HKT on an off-peak minute — even a ~40 min delay lands by 7.
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Force the AI Studio endpoint (generativelanguage.googleapis.com) —
          # the free-tier path. Auto-detect would route AQ.-prefixed keys to
          # Vertex AI, which bills through the linked GCP project.
          GEMINI_PROVIDER: aistudio
        run: python generate.py

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily market brief: $(date -u +%Y-%m-%d)"
            git push
          fi
