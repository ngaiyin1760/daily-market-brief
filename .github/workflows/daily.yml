name: Daily Market Brief

on:
  schedule:
    # Target: ready by 7:00 AM Hong Kong time. GitHub frequently delays
    # scheduled runs (especially on-the-hour), so fire at 22:17 UTC =
    # 6:17 AM HKT on an off-peak minute — even a ~40 min delay lands by 7.
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Cloudflare Worker proxy for browser-side Gemini calls — lets the
          # Search page's semantic mode work from HK without a VPN. The
          # browser never sees any API key; embeddings are precomputed at
          # build time with GEMINI_API_KEY.
          WORKER_URL: https://dmb-search-proxy.ngaiyin1760.workers.dev
          # Force the AI Studio endpoint (generativelanguage.googleapis.com) —
          # the free-tier path. Auto-detect would route AQ.-prefixed keys to
          # Vertex AI, which bills through the linked GCP project.
          GEMINI_PROVIDER: aistudio
          # GitHub API token for the Repo Radar tab's search queries
          # (higher rate limit than anonymous; automatically provided).
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rare native crashes (e.g. "double free or corruption" from the
          # HTML-parsing stack under threads) are flaky — retry once before
          # failing the run. --check fails loudly on structural problems or
          # a fully-heuristic run (systemic Gemini failure) so a degraded
          # brief is never silently published.
          python generate.py --check || {
            echo "::warning::generate.py failed, retrying once in 30s..."
            sleep 30
            python generate.py --check
          }

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily market brief: $(date -u +%Y-%m-%d)"
            git push
          fi
